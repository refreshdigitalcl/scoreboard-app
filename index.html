<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCOREBOARD</title>
<link rel="stylesheet" href="css/app.css?v=4">
<link rel="stylesheet" href="css/board.css?v=4">
<link rel="stylesheet" href="css/tools.css?v=4">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">🏆</div><div><h1 data-i18n="app_name">SCOREBOARD</h1><small data-i18n="tagline"></small></div></div>
    <div class="row" style="flex:0;align-items:center;flex-wrap:nowrap">
      <select id="langSel" class="langsel" onchange="setLang(this.value)"><option value="es">Español</option><option value="en">English</option></select>
      <button id="logoutBtn" class="btn hidden" onclick="doLogout()" data-i18n="logout"></button>
    </div>
  </div>
  <div id="cfgMsg" class="msg err" data-i18n="config_missing"></div>

  <!-- LOGIN -->
  <section id="v-login" class="card hidden" style="max-width:440px;margin:0 auto">
    <h2 data-i18n="login_title"></h2>
    <p class="muted small" data-i18n="privacy_note"></p>
    <button class="btn btn-google" onclick="loginGoogle()">🔐 <span data-i18n="login_google"></span></button>
    <div class="sep" data-i18n="or"></div>
    <label data-i18n="email"></label><input id="lgEmail" type="email" autocomplete="email">
    <label data-i18n="password"></label><input id="lgPass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button class="btn btn-primary" onclick="loginEmail(false)" data-i18n="sign_in"></button>
      <button class="btn" onclick="loginEmail(true)" data-i18n="sign_up"></button>
    </div>
    <p style="margin:14px 0 0"><a class="link" onclick="resetPass()" data-i18n="forgot"></a></p>
    <div id="lgMsg" class="msg"></div>
  </section>

  <!-- ASISTENTE -->
  <section id="v-wizard" class="card hidden">
    <h2 data-i18n="wiz_title"></h2>
    <div class="muted small"><span data-i18n="step"></span> <span id="wzN">1</span> <span data-i18n="of"></span> 5</div>
    <div class="steps" id="wzSteps"><i></i><i></i><i></i><i></i><i></i></div>

    <div id="s1">
      <h3 data-i18n="s1_title"></h3>
      <label data-i18n="s1_name"></label><input id="pfName" autocomplete="name">
      <label data-i18n="s1_school"></label><input id="pfSchool">
      <label data-i18n="s1_subject"></label><input id="pfSubject">
      <label data-i18n="s1_lang"></label>
      <select id="pfLang" onchange="setLang(this.value)"><option value="es">Español</option><option value="en">English</option></select>
    </div>

    <div id="s2" class="hidden">
      <h3 data-i18n="s2_title"></h3>
      <p class="muted small" data-i18n="s2_help"></p>
      <div class="drop" onclick="document.getElementById('fileIn').click()">📄<b data-i18n="s2_drop"></b></div>
      <input id="fileIn" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="onFile(this.files[0])">
      <div id="fileInfo" class="fileinfo"></div>
      <p style="margin-top:16px"><a class="link" onclick="downloadTemplate()" data-i18n="s2_template"></a></p>
      <p><a class="link" onclick="skipImport()" data-i18n="s2_manual"></a></p>
    </div>

    <div id="s3" class="hidden">
      <h3 data-i18n="s3_title"></h3>
      <p class="muted small" data-i18n="s3_help"></p>
      <label class="check"><input type="checkbox" id="mapSheet" onchange="onMapChange()"><span data-i18n="class_from_sheet"></span></label>
      <div id="mapClsBox"><label data-i18n="col_class"></label><select id="mapCls" onchange="onMapChange()"></select></div>
      <label data-i18n="col_name"></label><select id="mapName" onchange="onMapChange()"></select>
      <label data-i18n="col_email1"></label><select id="mapE1" onchange="onMapChange()"></select>
      <label data-i18n="col_email2"></label><select id="mapE2" onchange="onMapChange()"></select>
    </div>

    <div id="s4" class="hidden">
      <h3 data-i18n="s4c_title"></h3>
      <p class="muted small" data-i18n="s4c_help"></p>
      <div class="row" style="align-items:center">
        <input id="clsSearch" data-i18n-ph="s4c_search" oninput="renderClsPick()" style="flex:2">
        <button class="btn" onclick="clsPickAll(true)" data-i18n="s4c_all" style="flex:0 0 auto"></button>
        <button class="btn" onclick="clsPickAll(false)" data-i18n="s4c_none" style="flex:0 0 auto"></button>
      </div>
      <div class="muted small" style="margin-top:10px"><b id="clsPicked">0</b> <span data-i18n="s4c_selected"></span></div>
      <div id="clsPick" class="classes"></div>
    </div>

    <div id="s5" class="hidden">
      <h3 data-i18n="s4_title"></h3>
      <div class="stats" id="stats"></div>
      <div class="muted small" data-i18n="s4_preview"></div>
      <div class="tablewrap"><table id="prevTable"></table></div>
    </div>

    <div id="wzMsg" class="msg"></div>
    <div class="actions">
      <button class="btn" id="wzBack" onclick="wzGo(-1)" data-i18n="back"></button>
      <button class="btn btn-primary" id="wzNext" onclick="wzGo(1)" data-i18n="next"></button>
    </div>
  </section>

  <!-- INICIO -->
  <section id="v-home" class="hidden">
    <div class="tool-dock" id="toolDock">
      <button data-tool="timer" style="background:linear-gradient(135deg,#22c55e,#22d3ee)" onclick="openTool('timer')">⏱️<span class="td-tooltip" data-i18n="tl_timer"></span></button>
      <button data-tool="groups" style="background:linear-gradient(135deg,#22c55e,#4ade80)" onclick="openTool('groups')">👥<span class="td-tooltip" data-i18n="tl_groups"></span></button>
      <button data-tool="draw" style="background:linear-gradient(135deg,#ff5d5d,#ffd166)" onclick="openTool('draw')">🎲<span class="td-tooltip" data-i18n="tl_draw"></span></button>
      <button data-tool="spell" style="background:linear-gradient(135deg,#f59e0b,#ec4899)" onclick="openTool('spell')">🐝<span class="td-tooltip" data-i18n="tl_spell"></span></button>
    </div>
    <div class="tabs">
      <button id="tab-board" class="on" onclick="showTab('board')" data-i18n="tab_board"></button>
      <button id="tab-podium" onclick="showTab('podium')" data-i18n="tab_podium"></button>
      <button id="tab-courses" onclick="showTab('courses')" data-i18n="tab_courses"></button>
      <button id="soundBtn" class="soundbtn" style="flex:0" onclick="toggleSound()">🔊</button>
    </div>
    <div id="clsChips" class="chips"></div>

    <div id="pane-board">
      <div class="card">
        <div class="toolbar">
          <input id="bSearch" data-i18n-ph="search_student" oninput="boardRender()">
          <select id="bSort" onchange="boardRender()">
            <option value="total" data-i18n="sort_total"></option>
            <option value="week" data-i18n="sort_week"></option>
            <option value="today" data-i18n="sort_today"></option>
            <option value="name" data-i18n="sort_name"></option>
          </select>
          <span class="stat-pill"><span data-i18n="stat_students"></span> <b id="statCount">0</b></span>
          <span class="stat-pill"><span data-i18n="stat_with"></span> <b id="statWith">0</b></span>
          <span class="stat-pill"><span data-i18n="stat_today"></span> <b id="statToday">0</b></span>
        </div>
        <div style="overflow-x:auto">
          <table class="bt">
            <thead><tr><th></th><th data-i18n="th_student"></th><th data-i18n="th_today"></th><th data-i18n="th_week"></th><th data-i18n="th_total"></th><th data-i18n="th_award"></th></tr></thead>
            <tbody id="bRows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pane-podium" class="hidden">
      <div class="card podium-wrap">
        <div class="podium-title" id="podTitle">🏆</div>
        <div class="muted" id="podSub" data-i18n="pick_class_podium"></div>
        <div class="stage" id="stage"></div>
        <div class="podium-actions">
          <button class="btn btn-primary" onclick="celebrate()" data-i18n="celebrate"></button>
          <select id="podMetric" onchange="renderPodium()">
            <option value="total" data-i18n="rank_total"></option>
            <option value="week" data-i18n="rank_week"></option>
            <option value="month" data-i18n="rank_month"></option>
          </select>
        </div>
        <div id="rankBox" style="text-align:left;margin-top:8px">
          <h3 style="margin:0 0 10px;text-align:center" data-i18n="rank_full"></h3>
          <div class="ranking-scroll"><table class="bt"><thead><tr><th></th><th data-i18n="th_student"></th><th data-i18n="pts"></th></tr></thead><tbody id="rankRows"></tbody></table></div>
        </div>
      </div>
    </div>

    <div id="pane-tools" class="hidden">
      <div id="tool-timer" class="toolpane active"><div class="card timer-wrap">
        <div class="timer-modes">
          <button class="tbtn tbtn-ghost" id="modeCountdown" onclick="setTimerMode('countdown')" data-i18n="tm_countdown"></button>
          <button class="tbtn tbtn-ghost" id="modeStopwatch" onclick="setTimerMode('stopwatch')" data-i18n="tm_stopwatch"></button>
        </div>
        <div class="timer-stepper">
          <button class="tbtn stepper-btn stepper-minus" id="stepperMinus" onclick="adjustTimer(-60)">−</button>
          <div class="timer-display" id="timerDisplay">00:00</div>
          <button class="tbtn stepper-btn stepper-plus" id="stepperPlus" onclick="adjustTimer(60)">+</button>
        </div>
        <div class="timer-progress-wrap" id="timerProgressWrap"><div class="timer-progress-bar" id="timerProgressBar"></div></div>
        <div class="timer-controls">
          <button class="tbtn tbtn-primary" onclick="startTimer()" data-i18n="tm_start"></button>
          <button class="tbtn tbtn-ghost" onclick="pauseTimer()" data-i18n="tm_pause"></button>
          <button class="tbtn tbtn-ghost" onclick="resetTimer()" data-i18n="tm_reset"></button>
          <button class="tbtn tbtn-ghost" onclick="toggleFullscreen()" data-i18n="tm_full"></button>
        </div>
      </div></div>

      <div id="tool-groups" class="toolpane"><div class="card group-card"><div class="draw-card-row">
        <div><h3 style="margin:0 0 4px" data-i18n="gr_title"></h3><p class="session-note" style="margin:0" id="groupStatus"></p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <div class="group-size-picker" id="groupSizePicker">
            <button class="size-btn active" data-size="2" onclick="setGroupSize(2)" data-i18n="gr_pairs"></button>
            <button class="size-btn" data-size="4" onclick="setGroupSize(4)" data-i18n="gr_four"></button>
            <input type="number" id="groupCustomSize" class="size-custom" min="2" max="30" placeholder="N°" onfocus="setGroupSize('custom')" oninput="setGroupSize('custom')">
          </div>
          <button class="tbtn tbtn-draw" onclick="startRandomGroups()" data-i18n="gr_go"></button>
        </div></div></div></div>

      <div id="tool-draw" class="toolpane"><div class="card draw-card"><div class="draw-card-row">
        <div><h3 style="margin:0 0 4px" data-i18n="dr_title"></h3><p class="session-note" style="margin:0" id="drawStatus"></p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="tbtn tbtn-ghost" onclick="resetDrawPool()" data-i18n="dr_reset"></button>
          <button class="tbtn tbtn-draw" onclick="startRandomDraw()" data-i18n="dr_go"></button>
        </div></div></div></div>

      <div id="tool-spell" class="toolpane"><div class="card spell-card">
        <div class="spell-top"><h3 style="margin:0" data-i18n="sp_title"></h3><div class="spell-levels" id="spellLevels"></div></div>
        <div class="spell-stage" id="spellStage">
          <div class="spell-ring"></div><div class="spell-word" id="spellWord">?</div>
          <div class="spell-sub" id="spellSub" data-i18n="sp_choose"></div>
          <div class="spell-bar" id="spellBarWrap"><div id="spellBar"></div></div>
        </div>
        <div class="spell-actions">
          <button class="tbtn tbtn-draw" id="spellGo" onclick="spellReveal()" data-i18n="sp_reveal"></button>
          <button class="tbtn tbtn-ghost" onclick="spellSpeak()" data-i18n="sp_say"></button>
          <button class="tbtn tbtn-ghost" onclick="spellReset()" data-i18n="sp_reset"></button>
          <button class="tbtn tbtn-ghost" onclick="toggleFullscreen()" data-i18n="tm_full"></button>
          <label class="spell-opt"><input type="checkbox" id="spellTimerOn" checked style="width:auto"> <span data-i18n="sp_bar"></span></label>
        </div>
        <p class="session-note" id="spellCount" style="margin:8px 0 0;text-align:center"></p>
      </div></div>
    </div>

    <div id="pane-courses" class="hidden">
    <div class="card">
      <h2><span data-i18n="home_hello"></span>, <span id="hmName"></span> 👋</h2>
      <div class="muted small" id="hmSchool"></div>
      <h3 style="margin-top:20px" data-i18n="home_classes"></h3>
      <div id="hmClasses" class="classes"></div>
      <div id="hmEmpty" class="muted hidden" data-i18n="home_empty"></div>
      <div class="row" style="margin-top:18px">
        <button class="btn btn-primary" onclick="startImport()" data-i18n="home_import"></button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 data-i18n="home_add"></h3>
      <div class="row">
        <div><label data-i18n="add_name"></label><input id="adName"></div>
        <div><label data-i18n="add_class"></label><input id="adCls" list="clsList"><datalist id="clsList"></datalist></div>
      </div>
      <div class="row">
        <div><label data-i18n="add_email1"></label><input id="adE1" type="email"></div>
        <div><label data-i18n="add_email2"></label><input id="adE2" type="email"></div>
      </div>
      <div style="margin-top:16px"><button class="btn" onclick="addStudent()" data-i18n="add_btn"></button></div>
      <div id="adMsg" class="msg"></div>
    </div>
    <p class="muted small" style="margin-top:16px" data-i18n="next_stage"></p>
  
    </div>
  </section>
  <canvas id="confetti"></canvas>
</div>
<div class="modal-bg" id="drawModalBg"><div class="modal draw-modal">
  <button class="modal-close" onclick="closeDrawModal()">✕</button>
  <div class="draw-stage"><div class="draw-label" id="drawClassLabel"></div><div class="draw-name" id="drawName">???</div><div class="draw-sub" id="drawSub"></div></div>
  <div class="draw-actions" id="drawActions" style="display:none">
    <button class="tbtn tbtn-primary" onclick="startRandomDraw()" data-i18n="dr_again"></button>
    <button class="tbtn tbtn-ghost" onclick="closeDrawModal()" data-i18n="close"></button>
  </div></div></div>
<div class="modal-bg" id="groupModalBg"><div class="modal group-modal">
  <button class="modal-close" onclick="closeGroupModal()">✕</button>
  <h3 id="groupModalTitle"></h3><div class="group-results" id="groupResults"></div>
  <div class="draw-actions">
    <button class="tbtn tbtn-primary" onclick="startRandomGroups()" data-i18n="gr_again"></button>
    <button class="tbtn tbtn-ghost" onclick="closeGroupModal()" data-i18n="close"></button>
  </div></div></div>
<script src="js/firebase-config.js?v=4"></script>
<script src="js/i18n.js?v=4"></script>
<script src="js/importer.js?v=4"></script>
<script src="js/sounds.js?v=4"></script>
<script src="js/board.js?v=4"></script>
<script src="js/pools.js?v=4"></script>
<script src="js/tools.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
